name: distr-arch-todo-list

# Shared definition of the API. api-1 and api-2 are two replicas of the same service, reachable only through the gateway.
x-api: &api
  build:
    context: .
    dockerfile: services/api/Dockerfile
  image: distr-arch-todo-list-api
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

x-api-environment: &api-environment
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-todolist}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-todolist}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-todolist}
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-todolist}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-todolist}
  JWT_SECRET: ${JWT_SECRET:-PtzDowd3Vw16Sz3T4FQM6m+366pPJbS5IPoSZS5Upkc=}

services:
  postgres:
    build:
      context: ./infra/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todolist}
      POSTGRES_USER: ${POSTGRES_USER:-todolist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todolist}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    build:
      context: ./infra/rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-todolist}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-todolist}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  mailpit:
    build:
      context: ./infra/mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-1:
    <<: *api
    environment:
      <<: *api-environment
      INSTANCE_ID: api-1

  api-2:
    <<: *api
    environment:
      <<: *api-environment
      INSTANCE_ID: api-2

  notification-worker:
    build:
      context: .
      dockerfile: services/notification-worker/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-todolist}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-todolist}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  gateway:
    build:
      context: ./infra/nginx
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/gateway/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  rabbitmq-data:
