events {}

http {
    log_format gateway '$remote_addr "$request" status=$status upstream=$upstream_addr rate_limit=$limit_req_status';
    access_log /dev/stdout gateway;

    limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
    limit_req_status 429;

    upstream api_backend {
        least_conn;
        server api-1:8080 max_fails=3 fail_timeout=10s;
        server api-2:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 2s;

        error_page 429 @too_many_requests;

        location = /gateway/health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        location ~ ^/api/auth/(login|register|forgot-password|reset-password)$ {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://api_backend;
        }

        location / {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://api_backend;
        }

        location @too_many_requests {
            default_type application/problem+json;
            return 429 '{"title":"Too Many Requests","status":429,"detail":"Rate limit exceeded, try again later"}';
        }
    }
}
