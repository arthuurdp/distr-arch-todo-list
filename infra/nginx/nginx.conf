worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    log_format gateway '$remote_addr "$request" status=$status upstream=$upstream_addr '
                       'request_time=$request_time rate_limit=$limit_req_status';
    access_log /dev/stdout gateway;
    error_log /dev/stderr warn;

    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    upstream api_backend {
        zone api_backend 64k;

        least_conn;

        server api-1:8080 resolve max_fails=3 fail_timeout=10s;
        server api-2:8080 resolve max_fails=3 fail_timeout=10s;

        keepalive 32;
    }

    server {
        listen 80;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;

        error_page 429 @too_many_requests;
        error_page 502 503 504 @service_unavailable;

        location = /gateway/health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        location ~ ^/api/auth/(login|register)$ {
            limit_req zone=api_auth burst=5 nodelay;
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://api_backend;
        }

        location / {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://api_backend;
        }

        location @too_many_requests {
            default_type application/problem+json;
            return 429 '{"title":"Too Many Requests","status":429,"detail":"Rate limit exceeded, try again later"}';
        }

        location @service_unavailable {
            default_type application/problem+json;
            return 503 '{"title":"Service Unavailable","status":503,"detail":"No API instance is available at the moment"}';
        }
    }
}
