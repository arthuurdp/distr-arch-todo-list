<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome to Todo List</title>
</head>
<body style="margin:0; padding:24px; background:#f4f4f5; font-family:Arial, Helvetica, sans-serif; color:#18181b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0"
               style="background:#ffffff; border-radius:8px; padding:32px;">
          <tr>
            <td>
              <h1 style="margin:0 0 16px; font-size:22px;">Welcome, <span th:text="${name}">Test</span>!</h1>
              <p style="margin:0 0 12px; line-height:1.5;">Your Todo List account was created successfully.</p>
              <p style="margin:0; line-height:1.5;">You can now sign in and start organizing your tasks.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
