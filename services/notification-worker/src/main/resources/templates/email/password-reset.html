<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your password reset code</title>
</head>
<body style="margin:0; padding:24px; background:#f4f4f5; font-family:Arial, Helvetica, sans-serif; color:#18181b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0"
               style="background:#ffffff; border-radius:8px; padding:32px;">
          <tr>
            <td>
              <p style="margin:0 0 16px; line-height:1.5;">Hi <span th:text="${name}">Test</span>,</p>
              <p style="margin:0 0 16px; line-height:1.5;">Here's your 6-digit code to reset your password:</p>
              <p th:text="${code}"
                 style="margin:0 0 16px; padding:16px; background:#f4f4f5; border-radius:6px; text-align:center;
                        font-size:32px; font-weight:bold; letter-spacing:8px; font-family:'Courier New', monospace;">
                123456
              </p>
              <p style="margin:0 0 12px; line-height:1.5;">
                The code expires in <strong th:text="${expiresInMinutes} + ' minutes'">15 minutes</strong>
                and can be used only once.
              </p>
              <p style="margin:0; line-height:1.5; color:#71717a; font-size:13px;">
                If you did not request a password reset, you can ignore this email. Your password stays the same.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
