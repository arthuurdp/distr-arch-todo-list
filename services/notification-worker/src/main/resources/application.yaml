spring:
  application:
    name: notification-worker
  rabbitmq:
    listener:
      simple:
        # A failing message is tried 3 times in total (1 attempt + 2 retries, waiting 1s and then 2s).
        # After that it is rejected without requeue, and RabbitMQ moves it to the queue's dead-letter queue.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
  mail:
    host: localhost
    port: 1025
    # JavaMail has no timeouts by default: an unreachable SMTP server would block the consumer forever instead of
    # failing, so retries and the dead-letter queue would never kick in.
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

app:
  mail:
    from: "Todo List <no-reply@todolist.com>"

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      # The worker stays healthy while the SMTP server is down: failed emails are retried and then dead-lettered.
      enabled: false
