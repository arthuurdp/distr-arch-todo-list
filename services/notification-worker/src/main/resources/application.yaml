spring:
  application:
    name: notification-worker
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
  mail:
    host: localhost
    port: 1025
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

app:
  mail:
    from: "Todo List <no-reply@todolist.com>"

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false
