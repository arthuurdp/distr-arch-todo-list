spring:
  application:
    name: api
  datasource:
    url: jdbc:postgresql://localhost:5432/todolist
    username: todolist
    password: todolist
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100

server:
  forward-headers-strategy: framework

app:
  instance-id: ${INSTANCE_ID:local}
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789}
    issuer: todolist-api
    expiration: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    rabbit:
      enabled: false
